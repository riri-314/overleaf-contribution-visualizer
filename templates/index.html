<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Overleaf Contribution Visualizer</title>
  <script src="https://cdn.plot.ly/plotly-2.35.2.min.js" charset="utf-8"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:      #f0f2f5;
      --surface: #ffffff;
      --border:  #e2e8f0;
      --primary: #4C72B0;
      --danger:  #C44E52;
      --text:    #1a202c;
      --muted:   #718096;
      --radius:  10px;
      --shadow:  0 1px 3px rgba(0,0,0,.07), 0 4px 12px rgba(0,0,0,.05);
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    /* ── Header ── */
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 0 2rem;
      display: flex;
      align-items: center;
      gap: .75rem;
      height: 54px;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    header h1 { font-size: .9rem; font-weight: 600; color: var(--muted); }
    header .sep { color: var(--border); font-size: 1.2rem; }
    #project-link {
      font-size: .95rem;
      font-weight: 700;
      color: var(--primary);
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: .3rem;
    }
    #project-link:hover { text-decoration: underline; }

    /* ── Main ── */
    main { max-width: 1400px; margin: 0 auto; padding: 1.25rem 2rem 3rem; }

    /* ── Top bar ── */
    .top-bar {
      display: flex;
      flex-wrap: wrap;
      gap: .75rem;
      align-items: center;
      margin-bottom: 1.25rem;
    }
    .stats { display: flex; gap: .75rem; flex-wrap: wrap; }
    .stat {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: .45rem .9rem;
      font-size: .82rem;
      color: var(--muted);
    }
    .stat b { color: var(--primary); font-weight: 700; }

    .actions { display: flex; gap: .5rem; margin-left: auto; align-items: center; }

    button {
      display: inline-flex;
      align-items: center;
      gap: .35rem;
      border: none;
      border-radius: 7px;
      padding: .45rem 1rem;
      font-size: .83rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity .15s, transform .1s;
    }
    button:disabled { opacity: .4; cursor: not-allowed; }
    button:not(:disabled):active { transform: scale(.97); }
    #btn-fetch   { background: var(--primary); color: #fff; }
    #btn-refetch { background: var(--danger);  color: #fff; }
    #btn-fetch:not(:disabled):hover,
    #btn-refetch:not(:disabled):hover { opacity: .85; }

    /* ── Status bar ── */
    #status-bar {
      display: none;
      align-items: center;
      gap: .6rem;
      padding: .6rem 1rem;
      border-radius: var(--radius);
      font-size: .83rem;
      margin-bottom: 1rem;
      border: 1px solid var(--border);
      background: var(--surface);
    }
    #status-bar.show     { display: flex; }
    #status-bar.is-error { border-color: var(--danger); background: #fff5f5; color: var(--danger); }

    .spinner {
      width: 15px; height: 15px;
      border: 2px solid #cbd5e0;
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin .65s linear infinite;
      flex-shrink: 0;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Tabs ── */
    .tabs {
      display: flex;
      gap: .25rem;
      border-bottom: 2px solid var(--border);
      margin-bottom: 1.25rem;
    }
    .tab-btn {
      background: none;
      border: none;
      border-bottom: 2px solid transparent;
      margin-bottom: -2px;
      padding: .55rem 1.1rem;
      font-size: .875rem;
      font-weight: 500;
      color: var(--muted);
      cursor: pointer;
      border-radius: 0;
      transition: color .15s, border-color .15s;
    }
    .tab-btn:not(:disabled):active { transform: none; }
    .tab-btn.active { color: var(--primary); border-bottom-color: var(--primary); font-weight: 600; }
    .tab-btn:hover:not(.active) { color: var(--text); }

    /* ── Chart panels ── */
    .tab-panel { display: none; }
    .tab-panel.active { display: block; }

    .chart-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 1.1rem;
    }
    .chart-grid .full { grid-column: 1 / -1; }
    @media (max-width: 820px) {
      .chart-grid { grid-template-columns: 1fr; }
      .chart-grid .full { grid-column: 1; }
    }

    .chart-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: .75rem .75rem .5rem;
      height: 420px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .chart-card.tall { height: 600px; }

    /* Chart divs fill the remaining card height */
    .chart-card > [id^="chart-"] {
      flex: 1;
      min-height: 0;
    }

    /* ── Empty state ── */
    #no-data {
      display: none;
      text-align: center;
      padding: 5rem 2rem;
      color: var(--muted);
    }
    #no-data p { margin-top: .4rem; font-size: .9rem; }
  </style>
</head>
<body>

<header>
  <h1>Overleaf Visualizer</h1>
  <span class="sep">›</span>
  <a id="project-link" href="#" target="_blank" rel="noopener">
    <span id="project-title">Loading…</span>
    <svg width="11" height="11" viewBox="0 0 12 12" fill="none">
      <path d="M3.5 1H11M11 1V8.5M11 1L1 11" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </a>
</header>

<main>
  <div class="top-bar">
    <div class="stats">
      <div class="stat">Last fetched <b id="last-fetch">—</b></div>
      <div class="stat"><b id="update-count">—</b> updates tracked</div>
      <div class="stat"><b id="cache-entries">—</b> diffs cached</div>
    </div>
    <div class="actions">
      <button id="btn-fetch">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 .49-3.86"/>
        </svg>
        Fetch Updates
      </button>
      <button id="btn-refetch">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/>
          <path d="M3.67 9a9 9 0 0 1 14.8-2.3L23 10M1 14l4.64 3.36A9 9 0 0 0 20.33 15"/>
        </svg>
        Refetch All
      </button>
    </div>
  </div>

  <div id="status-bar">
    <div class="spinner" id="status-spinner"></div>
    <span id="status-msg"></span>
  </div>

  <div id="no-data">
    <strong>No data yet.</strong>
    <p>Click <em>Fetch Updates</em> to download data from Overleaf.</p>
  </div>

  <div id="dashboard" style="display:none">
    <nav class="tabs">
      <button class="tab-btn active" data-tab="overview">Overview</button>
      <button class="tab-btn" data-tab="timeline">Timeline</button>
      <button class="tab-btn" data-tab="patterns">Patterns</button>
      <button class="tab-btn" data-tab="chapters">Chapters</button>
    </nav>

    <!-- Overview -->
    <div class="tab-panel active" id="tab-overview">
      <div class="chart-grid">
        <div class="chart-card" id="chart-words_overview"></div>
        <div class="chart-card" id="chart-share_pie"></div>
        <div class="chart-card full" id="chart-cumulative"></div>
      </div>
    </div>

    <!-- Timeline -->
    <div class="tab-panel" id="tab-timeline">
      <div class="chart-grid">
        <div class="chart-card full tall" id="chart-daily_intensity"></div>
        <div class="chart-card full" id="chart-session_timeline"></div>
      </div>
    </div>

    <!-- Patterns -->
    <div class="tab-panel" id="tab-patterns">
      <div class="chart-grid">
        <div class="chart-card" id="chart-sessions_heatmap"></div>
        <div class="chart-card" id="chart-sessions_per_week"></div>
        <div class="chart-card" id="chart-ins_vs_del"></div>
      </div>
    </div>

    <!-- Chapters -->
    <div class="tab-panel" id="tab-chapters">
      <div class="chart-grid">
        <div class="chart-card full tall" id="chart-top_chapters"></div>
        <div class="chart-card tall" id="chart-chapter_ownership"></div>
        <div class="chart-card" id="chart-chapter_scatter"></div>
      </div>
    </div>
  </div>
</main>

<script>
  // ── Tabs ──────────────────────────────────────────────────────────────────
  document.querySelectorAll(".tab-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
      document.querySelectorAll(".tab-panel").forEach(p => p.classList.remove("active"));
      btn.classList.add("active");
      document.getElementById("tab-" + btn.dataset.tab).classList.add("active");
      // Plotly needs a resize trigger when panels become visible
      window.dispatchEvent(new Event("resize"));
    });
  });

  // ── Helpers ───────────────────────────────────────────────────────────────
  function timeAgo(iso) {
    if (!iso) return "Never";
    const diff = Math.floor((Date.now() - new Date(iso)) / 1000);
    if (diff < 60)    return "just now";
    if (diff < 3600)  return `${Math.floor(diff / 60)}m ago`;
    if (diff < 86400) return `${Math.floor(diff / 3600)}h ago`;
    return `${Math.floor(diff / 86400)}d ago`;
  }

  const PLOTLY_CONFIG = {
    responsive: true,
    displaylogo: false,
    modeBarButtonsToRemove: ["select2d", "lasso2d", "autoScale2d"],
  };

  // ── Status polling ────────────────────────────────────────────────────────
  let pollTimer = null;

  async function fetchStatus() {
    const res = await fetch("/api/status");
    const d   = await res.json();

    document.getElementById("project-title").textContent = d.project.title;
    document.getElementById("project-link").href         = d.project.url;
    document.getElementById("last-fetch").textContent    = timeAgo(d.last_fetch);
    document.getElementById("update-count").textContent  = d.update_count;
    document.getElementById("cache-entries").textContent = d.cache_entries;

    const bar     = document.getElementById("status-bar");
    const spinner = document.getElementById("status-spinner");

    if (d.task.running) {
      bar.className = "show";
      spinner.style.display = "";
      document.getElementById("status-msg").textContent = d.task.message;
    } else if (d.task.error) {
      bar.className = "show is-error";
      spinner.style.display = "none";
      document.getElementById("status-msg").textContent = "Error: " + d.task.error;
    } else if (d.task.message) {
      bar.className = "show";
      spinner.style.display = "none";
      document.getElementById("status-msg").textContent = d.task.message;
    } else {
      bar.className = "";
    }

    document.getElementById("btn-fetch").disabled   = d.task.running;
    document.getElementById("btn-refetch").disabled = d.task.running;

    const wasRunning = !!pollTimer;
    if (d.task.running) {
      clearTimeout(pollTimer);
      pollTimer = setTimeout(fetchStatus, 1500);
    } else {
      pollTimer = null;
      if (wasRunning) loadCharts(); // refresh charts after task finishes
    }
  }

  // ── Chart rendering ───────────────────────────────────────────────────────
  async function loadCharts() {
    const res    = await fetch("/api/charts");
    const charts = await res.json();

    const hasData = Object.keys(charts).length > 0;
    document.getElementById("no-data").style.display    = hasData ? "none"  : "block";
    document.getElementById("dashboard").style.display  = hasData ? "block" : "none";

    if (!hasData) return;

    for (const [id, figJson] of Object.entries(charts)) {
      const el = document.getElementById("chart-" + id);
      if (!el) continue;
      const fig = JSON.parse(figJson);
      Plotly.react(el, fig.data, fig.layout, PLOTLY_CONFIG);
    }
  }

  // ── Actions ───────────────────────────────────────────────────────────────
  async function startTask(endpoint, confirmMsg) {
    if (confirmMsg && !confirm(confirmMsg)) return;
    await fetch(endpoint, { method: "POST" });
    pollTimer = setTimeout(fetchStatus, 300);
  }

  document.getElementById("btn-fetch").addEventListener("click",
    () => startTask("/api/fetch"));
  document.getElementById("btn-refetch").addEventListener("click",
    () => startTask("/api/refetch",
      "This will clear the diff cache and re-download everything. Continue?"));

  // ── Init ─────────────────────────────────────────────────────────────────
  fetchStatus();
  loadCharts();
</script>
</body>
</html>
