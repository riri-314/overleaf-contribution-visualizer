<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Overleaf Contribution Visualizer</title>
  <script src="https://cdn.plot.ly/plotly-2.35.2.min.js" charset="utf-8"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* ── Themes ── */
    :root, [data-theme="light"] {
      --bg:            #f0f2f5;
      --surface:       #ffffff;
      --border:        #e2e8f0;
      --primary:       #4C72B0;
      --danger:        #C44E52;
      --text:          #1a202c;
      --muted:         #718096;
      --radius:        10px;
      --shadow:        0 1px 3px rgba(0,0,0,.07), 0 4px 12px rgba(0,0,0,.05);
      --error-bg:      #fff5f5;
      --error-color:   #C44E52;
      --warning-bg:    #fffaf0;
      --warning-border:#d69e2e;
      --warning-color: #9c5a12;
      --spinner-track: #cbd5e0;
      /* Plotly */
      --plot-bg:       #ffffff;
      --plot-grid:     #f0f0f0;
      --plot-line:     #e2e8f0;
      --plot-font:     #1a202c;
    }

    [data-theme="dark"] {
      --bg:            #0d0f1a;
      --surface:       #141624;
      --border:        #252840;
      --primary:       #6b95d4;
      --danger:        #e06c6c;
      --text:          #e2e8f0;
      --muted:         #8892a4;
      --shadow:        0 1px 3px rgba(0,0,0,.3), 0 4px 12px rgba(0,0,0,.2);
      --error-bg:      #2a1515;
      --error-color:   #e06c6c;
      --warning-bg:    #2a2415;
      --warning-border:#9a6b1f;
      --warning-color: #f6c85f;
      --spinner-track: #2d3251;
      /* Plotly */
      --plot-bg:       #141624;
      --plot-grid:     #252840;
      --plot-line:     #252840;
      --plot-font:     #e2e8f0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
      transition: background .2s, color .2s;
    }

    /* ── Header ── */
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 0 2rem;
      display: flex;
      align-items: center;
      gap: .75rem;
      height: 54px;
      position: sticky;
      top: 0;
      z-index: 10;
      transition: background .2s, border-color .2s;
    }
    header h1 { font-size: .9rem; font-weight: 600; color: var(--muted); }
    header .sep { color: var(--border); font-size: 1.2rem; }
    #project-link {
      font-size: .95rem;
      font-weight: 700;
      color: var(--primary);
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: .3rem;
    }
    #project-link:hover { text-decoration: underline; }

    /* ── Theme toggle ── */
    #btn-theme {
      margin-left: auto;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--muted);
      border-radius: 50%;
      width: 34px;
      height: 34px;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background .2s, border-color .2s, color .2s;
      flex-shrink: 0;
    }
    #btn-theme:hover { color: var(--text); border-color: var(--muted); }
    #btn-theme:not(:disabled):active { transform: scale(.92); }
    #icon-sun  { display: none; }
    #icon-moon { display: block; }
    [data-theme="dark"] #icon-sun  { display: block; }
    [data-theme="dark"] #icon-moon { display: none; }

    /* ── Main ── */
    main { max-width: 1400px; margin: 0 auto; padding: 1.25rem 2rem 3rem; }

    /* ── Top bar ── */
    .top-bar {
      display: flex;
      flex-wrap: wrap;
      gap: .75rem;
      align-items: center;
      margin-bottom: 1.25rem;
    }
    .stats { display: flex; gap: .75rem; flex-wrap: wrap; }
    .stat {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: .45rem .9rem;
      font-size: .82rem;
      color: var(--muted);
      transition: background .2s, border-color .2s;
    }
    .stat b { color: var(--primary); font-weight: 700; }

    .actions { display: flex; gap: .5rem; align-items: center; }

    button {
      display: inline-flex;
      align-items: center;
      gap: .35rem;
      border: none;
      border-radius: 7px;
      padding: .45rem 1rem;
      font-size: .83rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity .15s, transform .1s;
    }
    button:disabled { opacity: .4; cursor: not-allowed; }
    button:not(:disabled):active { transform: scale(.97); }
    #btn-fetch   { background: var(--primary); color: #fff; }
    #btn-refetch { background: var(--danger);  color: #fff; }
    #btn-fetch:not(:disabled):hover,
    #btn-refetch:not(:disabled):hover { opacity: .85; }

    /* ── Status bar ── */
    #status-bar {
      display: none;
      align-items: center;
      gap: .6rem;
      padding: .6rem 1rem;
      border-radius: var(--radius);
      font-size: .83rem;
      margin-bottom: 1rem;
      border: 1px solid var(--border);
      background: var(--surface);
      transition: background .2s, border-color .2s;
    }
    #status-bar.show     { display: flex; }
    #status-bar.is-error {
      border-color: var(--danger);
      background: var(--error-bg);
      color: var(--error-color);
    }
    #status-bar.is-warning {
      border-color: var(--warning-border);
      background: var(--warning-bg);
      color: var(--warning-color);
    }

    .spinner {
      width: 15px; height: 15px;
      border: 2px solid var(--spinner-track);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin .65s linear infinite;
      flex-shrink: 0;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Tabs ── */
    .tabs {
      display: flex;
      gap: .25rem;
      border-bottom: 2px solid var(--border);
      margin-bottom: 1.25rem;
      overflow-x: auto;
      overflow-y: hidden;
      scrollbar-width: thin;
      transition: border-color .2s;
    }
    .tab-btn {
      background: none;
      border: none;
      border-bottom: 2px solid transparent;
      margin-bottom: -2px;
      padding: .55rem 1.1rem;
      font-size: .875rem;
      font-weight: 500;
      color: var(--muted);
      cursor: pointer;
      border-radius: 0;
      flex: 0 0 auto;
      transition: color .15s, border-color .15s;
    }
    .tab-btn:not(:disabled):active { transform: none; }
    .tab-btn.active { color: var(--primary); border-bottom-color: var(--primary); font-weight: 600; }
    .tab-btn:hover:not(.active) { color: var(--text); }

    /* ── Chart panels ── */
    .tab-panel { display: none; }
    .tab-panel.active { display: block; }

    .chart-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 1.1rem;
      min-width: 0;
    }
    .chart-grid .full { grid-column: 1 / -1; }
    @media (max-width: 820px) {
      .chart-grid { grid-template-columns: 1fr; }
      .chart-grid .full { grid-column: 1; }
    }

    .chart-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: .75rem .75rem .5rem;
      height: 420px;
      overflow: hidden;
      min-width: 0;
      display: flex;
      flex-direction: column;
      position: relative;
      transition: background .2s, border-color .2s;
    }
    .chart-card.tall { height: 600px; }

    /* Chart divs fill the remaining card space */
    .chart-card > .chart {
      flex: 1;
      width: 100%;
      min-height: 0;
      min-width: 0;  /* prevent flex item from expanding beyond card width */
    }
    .chart-card > .chart .plot-container,
    .chart-card > .chart .svg-container {
      max-width: 100%;
    }
    .chart-card > .chart.is-empty {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      color: var(--muted);
      font-size: .86rem;
      text-align: center;
    }

    @media (max-width: 640px) {
      header { padding: 0 1rem; }
      main { padding: 1rem 1rem 2rem; }
      .actions { flex-wrap: wrap; }
      .chart-card { padding: .55rem .5rem .4rem; }
      .chart-card.tall { height: 520px; }
    }

    /* ── Loading overlay (pseudo-elements, no extra DOM) ── */
    .chart-card.is-loading::before {
      content: '';
      position: absolute;
      inset: 0;
      background: var(--surface);
      border-radius: var(--radius);
      z-index: 2;
    }
    .chart-card.is-loading::after {
      content: '';
      position: absolute;
      /* calc-center avoids transform conflict with the spin keyframe */
      top: calc(50% - 14px);
      left: calc(50% - 14px);
      width: 28px;
      height: 28px;
      border: 2.5px solid var(--border);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin .7s linear infinite;
      z-index: 3;
    }

    /* ── Empty state ── */
    #no-data {
      display: none;
      text-align: center;
      padding: 5rem 2rem;
      color: var(--muted);
    }
    #no-data p { margin-top: .4rem; font-size: .9rem; }
  </style>
</head>
<body>

<header>
  <h1>Overleaf Visualizer</h1>
  <span class="sep">›</span>
  <a id="project-link" href="#" target="_blank" rel="noopener">
    <span id="project-title">Loading…</span>
    <svg width="11" height="11" viewBox="0 0 12 12" fill="none">
      <path d="M3.5 1H11M11 1V8.5M11 1L1 11" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </a>

  <button id="btn-theme" title="Toggle dark mode" aria-label="Toggle dark mode">
    <!-- Sun (shown in dark mode) -->
    <svg id="icon-sun" width="16" height="16" viewBox="0 0 24 24" fill="none"
         stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="5"/>
      <line x1="12" y1="1"  x2="12" y2="3"/>
      <line x1="12" y1="21" x2="12" y2="23"/>
      <line x1="4.22" y1="4.22"  x2="5.64" y2="5.64"/>
      <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
      <line x1="1" y1="12" x2="3"  y2="12"/>
      <line x1="21" y1="12" x2="23" y2="12"/>
      <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
      <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
    </svg>
    <!-- Moon (shown in light mode) -->
    <svg id="icon-moon" width="15" height="15" viewBox="0 0 24 24" fill="none"
         stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 12.79A9 9 0 1 1 11.21 3a7 7 0 0 0 9.79 9.79z"/>
    </svg>
  </button>
</header>

<main>
  <div class="top-bar">
    <div class="stats">
      <div class="stat">Last fetched <b id="last-fetch">—</b></div>
      <div class="stat"><b id="update-count">—</b> updates tracked</div>
      <div class="stat"><b id="cache-entries">—</b> diffs cached</div>
    </div>
    <div class="actions">
      <button id="btn-fetch">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 .49-3.86"/>
        </svg>
        Fetch Updates
      </button>
      <button id="btn-refetch">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/>
          <path d="M3.67 9a9 9 0 0 1 14.8-2.3L23 10M1 14l4.64 3.36A9 9 0 0 0 20.33 15"/>
        </svg>
        Refetch All
      </button>
    </div>
  </div>

  <div id="status-bar">
    <div class="spinner" id="status-spinner"></div>
    <span id="status-msg"></span>
  </div>

  <div id="no-data">
    <strong id="no-data-title">No data yet.</strong>
    <p id="no-data-msg">Click <em>Fetch Updates</em> to download data from Overleaf.</p>
  </div>

  <div id="dashboard" style="display:none">
    <nav class="tabs">
      <button class="tab-btn active" data-tab="overview">Overview</button>
      <button class="tab-btn" data-tab="timeline">Timeline</button>
      <button class="tab-btn" data-tab="patterns">Patterns</button>
      <button class="tab-btn" data-tab="chapters">Chapters</button>
    </nav>

    <!-- Overview -->
    <div class="tab-panel active" id="tab-overview">
      <div class="chart-grid">
        <div class="chart-card"><div class="chart" id="chart-words_overview"></div></div>
        <div class="chart-card"><div class="chart" id="chart-share_pie"></div></div>
        <div class="chart-card full"><div class="chart" id="chart-cumulative"></div></div>
      </div>
    </div>

    <!-- Timeline -->
    <div class="tab-panel" id="tab-timeline">
      <div class="chart-grid">
        <div class="chart-card full tall"><div class="chart" id="chart-daily_intensity"></div></div>
        <div class="chart-card full"><div class="chart" id="chart-session_timeline"></div></div>
      </div>
    </div>

    <!-- Patterns -->
    <div class="tab-panel" id="tab-patterns">
      <div class="chart-grid">
        <div class="chart-card"><div class="chart" id="chart-sessions_heatmap"></div></div>
        <div class="chart-card"><div class="chart" id="chart-sessions_per_week"></div></div>
        <div class="chart-card"><div class="chart" id="chart-ins_vs_del"></div></div>
      </div>
    </div>

    <!-- Chapters -->
    <div class="tab-panel" id="tab-chapters">
      <div class="chart-grid">
        <div class="chart-card full tall"><div class="chart" id="chart-top_chapters"></div></div>
        <div class="chart-card tall"><div class="chart" id="chart-chapter_ownership"></div></div>
        <div class="chart-card"><div class="chart" id="chart-chapter_scatter"></div></div>
      </div>
    </div>
  </div>
</main>

<script>
  // ── Theme ─────────────────────────────────────────────────────────────────
  const PLOTLY_THEME = {
    light: {
      paper_bgcolor: '#ffffff',
      plot_bgcolor:  '#ffffff',
      font_color:    '#1a202c',
      grid_color:    '#f0f0f0',
      line_color:    '#e2e8f0',
      hover_bg:      '#ffffff',
      hover_border:  '#cbd5e0',
      hover_font:    '#1a202c',
      legend_bg:     'rgba(255,255,255,0.90)',
      legend_border: '#e2e8f0',
    },
    dark: {
      paper_bgcolor: '#141624',
      plot_bgcolor:  '#141624',
      font_color:    '#e2e8f0',
      grid_color:    '#252840',
      line_color:    '#252840',
      hover_bg:      '#1f2336',
      hover_border:  '#4a5578',
      hover_font:    '#f8fafc',
      legend_bg:     'rgba(13,15,26,0.82)',
      legend_border: '#3a405f',
    },
  };

  function currentTheme() {
    return document.documentElement.dataset.theme || 'light';
  }

  function applyPlotlyTheme(fig) {
    const t = PLOTLY_THEME[currentTheme()];
    const layout = fig.layout;

    layout.paper_bgcolor = t.paper_bgcolor;
    layout.plot_bgcolor  = t.plot_bgcolor;
    if (!layout.font) layout.font = {};
    layout.font.color = t.font_color;
    layout.hoverlabel = {
      ...(layout.hoverlabel || {}),
      bgcolor: t.hover_bg,
      bordercolor: t.hover_border,
      font: {
        ...((layout.hoverlabel && layout.hoverlabel.font) || {}),
        color: t.hover_font,
        size: 12,
      },
    };
    layout.legend = {
      ...(layout.legend || {}),
      bgcolor: t.legend_bg,
      bordercolor: t.legend_border,
      borderwidth: 1,
      font: { ...((layout.legend && layout.legend.font) || {}), color: t.font_color },
    };

    // Update every axis in the figure (handles subplots)
    for (const key of Object.keys(layout)) {
      if (/^[xy]axis\d*$/.test(key)) {
        layout[key].gridcolor      = t.grid_color;
        layout[key].linecolor      = t.line_color;
        layout[key].zerolinecolor  = t.line_color;
        if (!layout[key].tickfont) layout[key].tickfont = {};
        layout[key].tickfont.color = t.font_color;
      }
    }

    // Subplot title annotations
    if (layout.annotations) {
      layout.annotations = layout.annotations.map(a => ({
        ...a, font: { ...(a.font || {}), color: t.font_color },
      }));
    }

    // Colorbar
    if (layout.coloraxis) {
      layout.coloraxis.colorbar = layout.coloraxis.colorbar || {};
      layout.coloraxis.colorbar.tickfont = { color: t.font_color };
    }
    for (const trace of fig.data || []) {
      if (!trace.colorbar) continue;
      trace.colorbar.tickfont = { ...(trace.colorbar.tickfont || {}), color: t.font_color };
      if (trace.colorbar.title) {
        if (typeof trace.colorbar.title === 'string') {
          trace.colorbar.title = { text: trace.colorbar.title, font: { color: t.font_color } };
        } else {
          trace.colorbar.title.font = { ...(trace.colorbar.title.font || {}), color: t.font_color };
        }
      }
    }

    // Extra bottom margin so axis labels and bottom legends aren't clipped
    layout.margin = {
      ...(layout.margin || {}),
      b: Math.max((layout.margin && layout.margin.b) || 0, 65),
    };
  }

  function setTheme(dark) {
    document.documentElement.dataset.theme = dark ? 'dark' : 'light';
    localStorage.setItem('theme', dark ? 'dark' : 'light');
    renderCharts();
  }

  // Restore saved theme immediately to avoid flash (dark is default)
  (function () {
    const saved = localStorage.getItem('theme');
    if (saved === 'light') document.documentElement.dataset.theme = 'light';
  })();

  document.getElementById('btn-theme').addEventListener('click', () => {
    setTheme(currentTheme() !== 'dark');
  });

  // ── Tabs ──────────────────────────────────────────────────────────────────
  document.querySelectorAll(".tab-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
      document.querySelectorAll(".tab-panel").forEach(p => p.classList.remove("active"));
      btn.classList.add("active");
      document.getElementById("tab-" + btn.dataset.tab).classList.add("active");
      resizeVisibleCharts();
    });
  });

  // ── Helpers ───────────────────────────────────────────────────────────────
  function timeAgo(iso) {
    if (!iso) return "Never";
    const diff = Math.floor((Date.now() - new Date(iso)) / 1000);
    if (diff < 60)    return "just now";
    if (diff < 3600)  return `${Math.floor(diff / 60)}m ago`;
    if (diff < 86400) return `${Math.floor(diff / 3600)}h ago`;
    return `${Math.floor(diff / 86400)}d ago`;
  }

  const PLOTLY_CONFIG = {
    responsive: true,
    displayModeBar: "hover",
    displaylogo: false,
    modeBarButtonsToRemove: ["select2d", "lasso2d", "autoScale2d"],
  };

  function plotlyConfigFor(el) {
    return {
      ...PLOTLY_CONFIG,
      displayModeBar: el.clientWidth < 480 ? false : PLOTLY_CONFIG.displayModeBar,
    };
  }

  // ── Status polling ────────────────────────────────────────────────────────
  let pollTimer = null;

  function cleanErrorMessage(message) {
    return String(message || "Request failed.").replace(/^ERROR:\s*/i, "");
  }

  function showStatus(message, options = {}) {
    const bar     = document.getElementById("status-bar");
    const spinner = document.getElementById("status-spinner");
    const text    = document.getElementById("status-msg");

    bar.className = options.error
      ? "show is-error"
      : options.warning
        ? "show is-warning"
        : "show";
    spinner.style.display = options.running ? "" : "none";
    text.textContent = options.error
      ? "Error: " + cleanErrorMessage(message)
      : message;
  }

  function hideStatus() {
    document.getElementById("status-bar").className = "";
  }

  async function readJsonResponse(res) {
    let data = {};
    try {
      data = await res.json();
    } catch (e) {
      data = {};
    }

    if (!res.ok) {
      throw new Error(data.error || `Request failed with HTTP ${res.status}.`);
    }

    return data;
  }

  async function fetchStatus() {
    let d;
    try {
      const res = await fetch("/api/status");
      d = await readJsonResponse(res);
    } catch (error) {
      if (pollTimer) {
        showStatus(
          (error.message || "Could not load server status.") + " Retrying...",
          { running: true }
        );
        clearTimeout(pollTimer);
        pollTimer = setTimeout(fetchStatus, 1500);
        return;
      }

      showStatus(error.message || "Could not load server status.", { error: true });
      document.getElementById("btn-fetch").disabled = false;
      document.getElementById("btn-refetch").disabled = false;
      clearTimeout(pollTimer);
      pollTimer = null;
      return;
    }

    document.getElementById("project-title").textContent = d.project.title;
    const projectLink = document.getElementById("project-link");
    projectLink.href = d.project.url;
    projectLink.toggleAttribute("aria-disabled", d.project.url === "#");
    document.getElementById("last-fetch").textContent    = timeAgo(d.last_fetch);
    document.getElementById("update-count").textContent  = d.update_count;
    document.getElementById("cache-entries").textContent = d.cache_entries;
    updateEmptyState(d);

    const missingDiffs = Number(d.data?.missing_diffs || 0);

    if (d.task.running) {
      showStatus(d.task.message, { running: true });
    } else if (d.task.error) {
      showStatus(d.task.error, { error: true });
    } else if (d.error) {
      showStatus(d.error, { error: true });
    } else if (missingDiffs > 0) {
      const plural = missingDiffs === 1 ? "" : "s";
      showStatus(
        `uncomplete data, click on "Fetch Updates" to fix (${missingDiffs} missing diff${plural})`,
        { warning: true }
      );
    } else if (d.task.message) {
      showStatus(d.task.message);
    } else {
      hideStatus();
    }

    document.getElementById("btn-fetch").disabled   = d.task.running;
    document.getElementById("btn-refetch").disabled = d.task.running;

    const wasRunning = !!pollTimer;
    if (d.task.running) {
      clearTimeout(pollTimer);
      pollTimer = setTimeout(fetchStatus, 1500);
    } else {
      pollTimer = null;
      if (wasRunning) loadCharts();
    }
  }

  // ── Chart rendering ───────────────────────────────────────────────────────
  let _chartsRaw = {};  // cached raw JSON strings from server

  function updateEmptyState(status) {
    const title = document.getElementById("no-data-title");
    const msg = document.getElementById("no-data-msg");

    if (status.last_fetch && status.update_count === 0 && status.cache_entries === 0) {
      title.textContent = "No updates found.";
      msg.textContent = "Overleaf did not return any project updates yet.";
    } else {
      title.textContent = "No data yet.";
      msg.innerHTML = "Click <em>Fetch Updates</em> to download data from Overleaf.";
    }
  }

  function resizeVisibleCharts() {
    requestAnimationFrame(() => {
      document.querySelectorAll(".tab-panel.active .chart.js-plotly-plot").forEach(el => {
        Plotly.Plots.resize(el);
      });
    });
  }

  function renderCharts() {
    const hasData = Object.keys(_chartsRaw).length > 0;
    document.getElementById("no-data").style.display   = hasData ? "none"  : "block";
    document.getElementById("dashboard").style.display = hasData ? "block" : "none";
    if (!hasData) return;

    document.querySelectorAll(".chart").forEach(el => {
      const id = el.id.replace(/^chart-/, "");
      if (_chartsRaw[id]) return;
      if (el.classList.contains("js-plotly-plot")) Plotly.purge(el);
      el.classList.add("is-empty");
      el.textContent = "No chart available for this data.";
    });

    for (const [id, figJson] of Object.entries(_chartsRaw)) {
      const el = document.getElementById("chart-" + id);
      if (!el) continue;
      el.classList.remove("is-empty");
      el.textContent = "";
      const fig = JSON.parse(figJson);   // fresh parse so we can mutate safely
      applyPlotlyTheme(fig);
      Plotly.react(el, fig.data, fig.layout, plotlyConfigFor(el));
    }
    resizeVisibleCharts();
  }

  async function loadCharts() {
    // Show the dashboard immediately so the card spinners are in the layout
    document.getElementById("no-data").style.display   = "none";
    document.getElementById("dashboard").style.display = "block";
    document.querySelectorAll('.chart-card').forEach(c => c.classList.add('is-loading'));

    try {
      const res = await fetch("/api/charts");
      _chartsRaw = await readJsonResponse(res);
    } catch (error) {
      _chartsRaw = {};
      showStatus(error.message || "Could not load charts.", { error: true });
    } finally {
      document.querySelectorAll('.chart-card').forEach(c => c.classList.remove('is-loading'));
      renderCharts();
    }
  }

  // ── Actions ───────────────────────────────────────────────────────────────
  async function startTask(endpoint, confirmMsg) {
    if (confirmMsg && !confirm(confirmMsg)) return;
    document.getElementById("btn-fetch").disabled = true;
    document.getElementById("btn-refetch").disabled = true;
    showStatus("Starting fetch...", { running: true });
    try {
      const res = await fetch(endpoint, { method: "POST" });
      await readJsonResponse(res);
    } catch (error) {
      showStatus(error.message || "Could not start fetch.", { error: true });
      document.getElementById("btn-fetch").disabled = false;
      document.getElementById("btn-refetch").disabled = false;
      return;
    }
    clearTimeout(pollTimer);
    pollTimer = setTimeout(fetchStatus, 300);
  }

  document.getElementById("btn-fetch").addEventListener("click",
    () => startTask("/api/fetch"));
  document.getElementById("btn-refetch").addEventListener("click",
    () => startTask("/api/refetch",
      "This will clear the diff cache and re-download everything. Continue?"));

  // ── Init ─────────────────────────────────────────────────────────────────
  fetchStatus();
  loadCharts();
</script>
</body>
</html>
